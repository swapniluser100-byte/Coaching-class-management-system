<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marks Upload · Tuition Admin</title>
<link rel="stylesheet" href="../shared/css/styles.css" />
</head>
<body>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/branding.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    requireAdminAuth();
    renderAdminShell("marks.html", `
      <div id="alertBox"></div>
      <div class="card">
        <label>Select Exam</label>
        <select id="examSelect"></select>
      </div>
      <div class="card" id="marksCard" style="display:none;">
        <div class="flex-between" style="flex-wrap:wrap; gap:8px;">
          <h2 class="mb-0" id="examHeading"></h2>
          <div class="flex gap-8" style="flex-wrap:wrap;">
            <button class="btn btn-secondary btn-sm" id="downloadTemplateBtn">${iconSvg("download")} Download CSV</button>
            <label class="btn btn-secondary btn-sm" style="cursor:pointer;">
              ${iconSvg("upload")} Upload CSV
              <input type="file" id="csvInput" accept=".csv" class="hidden" />
            </label>
            <button class="btn" id="saveMarksBtn">Save All Marks</button>
          </div>
        </div>
        <p class="text-muted mt-8" style="font-size:12px;">CSV columns: <code>phone, name, marks_obtained, remarks</code>. Matched by phone number — download the template first to get everyone's phone number pre-filled.</p>
        <p class="text-muted mt-8" style="font-size:12px;">Ranked by marks, highest first, once saved.</p>
        <div class="table-wrap mt-16">
          <table>
            <thead><tr><th>Rank</th><th>Student</th><th>Marks Obtained</th><th>Remarks</th></tr></thead>
            <tbody id="marksBody"></tbody>
          </table>
        </div>
      </div>
    `);
    setPageTitle("Marks Upload");

    let exams = [];
    let currentExam = null;
    let batchStudents = [];
    let existingMarks = {};

    const params = new URLSearchParams(location.search);
    const preselectExamId = params.get("exam_id");

    async function loadExams() {
      exams = await Api.request("admin", "/admin/exams");
      document.getElementById("examSelect").innerHTML =
        `<option value="">— select an exam —</option>` +
        exams.map((e) => `<option value="${e.id}" ${e.id === preselectExamId ? "selected" : ""}>${escapeHtml(e.exam_name)} (${e.exam_code})</option>`).join("");
    }

    function medalFor(rank) {
      if (rank === 1) return "🥇";
      if (rank === 2) return "🥈";
      if (rank === 3) return "🥉";
      return null;
    }

    function rankCell(rank) {
      if (rank == null) return `<span class="text-muted">—</span>`;
      const medal = medalFor(rank);
      return medal ? `<span class="medal-icon" style="font-size:20px;">${medal}</span>` : `#${rank}`;
    }

    async function loadExamMarks(examId) {
      currentExam = exams.find((e) => e.id === examId);
      if (!currentExam) return;

      document.getElementById("marksCard").style.display = "block";
      document.getElementById("examHeading").textContent = `${currentExam.exam_name} — Total: ${currentExam.total_marks}`;

      const [studentsRes, examDetail] = await Promise.all([
        Api.request("admin", `/admin/batch/${currentExam.batch_id}/students`),
        Api.request("admin", `/admin/exam/${currentExam.exam_code}`),
      ]);
      batchStudents = studentsRes;
      existingMarks = {};
      examDetail.marks.forEach((m) => { existingMarks[m.student_id] = m; });

      // Ranked by marks (highest first); students without marks yet sort to
      // the bottom, alphabetically, since they can't be ranked.
      const rows = batchStudents.map((s) => {
        const existing = existingMarks[s.id];
        return { student: s, marks_obtained: existing ? existing.marks_obtained : null, remarks: existing && existing.remarks ? existing.remarks : "" };
      });
      rows.sort((a, b) => {
        if (a.marks_obtained == null && b.marks_obtained == null) return a.student.name.localeCompare(b.student.name);
        if (a.marks_obtained == null) return 1;
        if (b.marks_obtained == null) return -1;
        return b.marks_obtained - a.marks_obtained;
      });
      rows.forEach((r, i) => {
        if (r.marks_obtained == null) { r.rank = null; return; }
        r.rank = i > 0 && rows[i - 1].marks_obtained === r.marks_obtained ? rows[i - 1].rank : i + 1;
      });

      const tbody = document.getElementById("marksBody");
      tbody.innerHTML = rows.map(({ student: s, marks_obtained, remarks, rank }) => `
        <tr data-student="${s.id}">
          <td>${rankCell(rank)}</td>
          <td>${escapeHtml(s.name)}</td>
          <td><input type="number" class="marksInput" min="0" max="${currentExam.total_marks}" value="${marks_obtained ?? ""}" /></td>
          <td><input type="text" class="remarksInput" value="${escapeHtml(remarks)}" /></td>
        </tr>
      `).join("");
    }

    document.getElementById("examSelect").addEventListener("change", (e) => {
      if (e.target.value) loadExamMarks(e.target.value).catch((err) => showAlert(document.getElementById("alertBox"), err.message));
      else document.getElementById("marksCard").style.display = "none";
    });

    document.getElementById("saveMarksBtn").addEventListener("click", async () => {
      const rows = [...document.querySelectorAll("#marksBody tr")];
      const marks = rows
        .map((row) => {
          const marksVal = row.querySelector(".marksInput").value;
          if (marksVal === "") return null;
          return {
            student_id: row.dataset.student,
            marks_obtained: parseInt(marksVal, 10),
            remarks: row.querySelector(".remarksInput").value.trim() || undefined,
          };
        })
        .filter(Boolean);

      try {
        await Api.request("admin", "/admin/exam/upload-marks", {
          method: "POST",
          body: { exam_id: currentExam.id, marks },
        });
        await loadExamMarks(currentExam.id);
        showAlert(document.getElementById("alertBox"), `Saved marks for ${marks.length} students.`, "success");
      } catch (err) {
        showAlert(document.getElementById("alertBox"), err.message);
      }
    });

    document.getElementById("downloadTemplateBtn").addEventListener("click", () => {
      if (!currentExam) return;
      const rows = [["phone", "name", "marks_obtained", "remarks"]];
      batchStudents.forEach((s) => {
        const existing = existingMarks[s.id];
        rows.push([s.phone, s.name, existing ? existing.marks_obtained : "", existing?.remarks || ""]);
      });
      const safeName = currentExam.exam_name.replace(/[^a-z0-9]+/gi, "_");
      downloadCsv(`${safeName}_marks_template.csv`, rows);
    });

    document.getElementById("csvInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file || !currentExam) return;

      const text = await file.text();
      const rows = parseCsv(text).filter((r) => r.some((c) => c.trim() !== ""));
      if (rows.length < 2) {
        showAlert(document.getElementById("alertBox"), "CSV file has no data rows.");
        return;
      }

      const header = rows[0].map((h) => h.trim().toLowerCase());
      const phoneIdx = header.indexOf("phone");
      const marksIdx = header.indexOf("marks_obtained");
      const remarksIdx = header.indexOf("remarks");
      if (phoneIdx === -1 || marksIdx === -1) {
        showAlert(document.getElementById("alertBox"), `CSV must have "phone" and "marks_obtained" columns. Found: ${rows[0].join(", ")}`);
        return;
      }

      const byPhone = {};
      batchStudents.forEach((s) => { byPhone[s.phone.trim()] = s; });

      let matched = 0;
      const unmatched = [];
      for (const r of rows.slice(1)) {
        const phone = (r[phoneIdx] || "").trim();
        if (!phone) continue;
        const student = byPhone[phone];
        if (!student) { unmatched.push(phone); continue; }
        const row = document.querySelector(`#marksBody tr[data-student="${student.id}"]`);
        if (!row) continue;
        const marksVal = (r[marksIdx] ?? "").trim();
        if (marksVal !== "") row.querySelector(".marksInput").value = marksVal;
        if (remarksIdx !== -1) row.querySelector(".remarksInput").value = (r[remarksIdx] || "").trim();
        matched++;
      }

      const msg = `Loaded ${matched} row(s) from the CSV into the table below — review, then click "Save All Marks" to save.` +
        (unmatched.length ? ` ${unmatched.length} phone number(s) weren't found in this batch: ${unmatched.join(", ")}.` : "");
      showAlert(document.getElementById("alertBox"), msg, unmatched.length ? "info" : "success");
    });

    (async () => {
      try {
        await loadExams();
        if (preselectExamId) await loadExamMarks(preselectExamId);
      } catch (err) {
        showAlert(document.getElementById("alertBox"), err.message);
      }
    })();
  </script>
</body>
</html>
