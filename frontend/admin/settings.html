<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Settings · Tuition Admin</title>
<link rel="stylesheet" href="../shared/css/styles.css" />
</head>
<body>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/branding.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    requireAdminAuth();
    renderAdminShell("settings.html", `
      <div id="alertBox"></div>
      <div class="card">
        <h2>General</h2>
        <p>Shown across every portal's login page, home page and branding.</p>
        <label>Tuition / Class Name</label>
        <input id="tuitionName" placeholder="e.g. Sharma's Classes" />
        <label>Brand Color</label>
        <div class="flex gap-8" style="align-items:center;">
          <input id="brandColor" type="color" style="width:56px; height:38px; padding:2px; flex-shrink:0;" />
          <input id="brandColorHex" placeholder="#3654e0" style="max-width:140px;" />
        </div>
        <button class="btn mt-16" id="saveGeneralBtn">Save</button>

        <label class="mt-16" style="display:block;">Logo</label>
        <div class="flex gap-8" style="align-items:center;">
          <img id="logoPreview" class="hidden" alt="Logo" style="height:48px; max-width:160px; object-fit:contain; border:1px solid var(--color-border); border-radius:8px; padding:4px;" />
          <span id="noLogoText" class="text-muted" style="font-size:13px;">No logo uploaded — the emoji icon is used by default.</span>
        </div>
        <input type="file" id="logoInput" accept="image/*" class="hidden" />
        <div class="flex gap-8 mt-8">
          <button class="btn btn-secondary" type="button" id="uploadLogoBtn">Upload Logo</button>
          <button class="btn btn-danger hidden" type="button" id="removeLogoBtn">Remove Logo</button>
        </div>
      </div>
      <div class="card">
        <h2>Plan / Renewal</h2>
        <p>Optional reminder shown as a banner in this console when the renewal date is near or past. It never restricts access — it's purely informational.</p>
        <label>Next Renewal Date</label>
        <input id="renewalDate" type="date" />
        <label>Amount Due</label>
        <input id="renewalAmount" type="number" min="0" step="0.01" placeholder="e.g. 500" />
        <label>Contact for Renewal</label>
        <input id="renewalContact" placeholder="e.g. billing@example.com or a phone number" />
        <div class="flex gap-8 mt-16">
          <button class="btn" id="saveRenewalBtn">Save</button>
          <button class="btn btn-secondary" id="clearRenewalBtn">Clear</button>
        </div>
      </div>
      <div class="card">
        <h2>API Connection</h2>
        <p>The Worker API this portal talks to. Stored locally in this browser only.</p>
        <label>API Base URL</label>
        <input id="apiBaseUrl" />
        <button class="btn mt-16" id="saveApiBtn">Save</button>
      </div>
      <div class="card">
        <h2>About Tutor Marks Permission</h2>
        <p>Toggle whether a tutor may upload exam marks from the <a href="tutors.html">Manage Tutors</a> page (per-tutor "Allowed to upload marks" checkbox).</p>
      </div>
      <div class="card">
        <h2>Session</h2>
        <p>Signed in as an administrator. Logging out clears this browser's session token only.</p>
        <button class="btn btn-danger" id="logoutBtn2">Log out</button>
      </div>
    `);
    setPageTitle("Settings");

    function refreshLogoPreview(logoUrl) {
      const img = document.getElementById("logoPreview");
      const noText = document.getElementById("noLogoText");
      const removeBtn = document.getElementById("removeLogoBtn");
      if (logoUrl) {
        img.src = `${window.API_BASE_URL}${logoUrl}`;
        img.classList.remove("hidden");
        noText.classList.add("hidden");
        removeBtn.classList.remove("hidden");
      } else {
        img.classList.add("hidden");
        noText.classList.remove("hidden");
        removeBtn.classList.add("hidden");
      }
    }

    (async () => {
      try {
        const settings = await Api.request(null, "/public/settings");
        document.getElementById("tuitionName").value = settings.tuition_name;
        document.getElementById("brandColor").value = settings.brand_color;
        document.getElementById("brandColorHex").value = settings.brand_color;
        refreshLogoPreview(settings.logo_url);
      } catch (err) {
        showAlert(document.getElementById("alertBox"), err.message);
      }
      try {
        const renewal = await Api.request("admin", "/admin/settings/renewal");
        document.getElementById("renewalDate").value = renewal.renewal_date || "";
        document.getElementById("renewalAmount").value = renewal.renewal_amount ?? "";
        document.getElementById("renewalContact").value = renewal.renewal_contact || "";
      } catch (err) {
        showAlert(document.getElementById("alertBox"), err.message);
      }
    })();

    document.getElementById("saveRenewalBtn").addEventListener("click", async () => {
      const alertBox = document.getElementById("alertBox");
      const renewal_date = document.getElementById("renewalDate").value || null;
      const amountRaw = document.getElementById("renewalAmount").value.trim();
      const renewal_amount = amountRaw ? parseFloat(amountRaw) : null;
      const renewal_contact = document.getElementById("renewalContact").value.trim() || null;
      try {
        await Api.request("admin", "/admin/settings/update", { method: "POST", body: { renewal_date, renewal_amount, renewal_contact } });
        showAlert(alertBox, "Saved. The banner (if applicable) updates on next page load.", "success");
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    });

    document.getElementById("clearRenewalBtn").addEventListener("click", async () => {
      if (!confirm("Clear the renewal reminder? The banner will stop showing until you set a new date.")) return;
      const alertBox = document.getElementById("alertBox");
      try {
        await Api.request("admin", "/admin/settings/update", { method: "POST", body: { renewal_date: null, renewal_amount: null, renewal_contact: null } });
        document.getElementById("renewalDate").value = "";
        document.getElementById("renewalAmount").value = "";
        document.getElementById("renewalContact").value = "";
        showAlert(alertBox, "Cleared.", "success");
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    });

    document.getElementById("uploadLogoBtn").addEventListener("click", () => {
      document.getElementById("logoInput").click();
    });
    document.getElementById("logoInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file) return;
      const alertBox = document.getElementById("alertBox");
      try {
        const data = await Api.request("admin", "/admin/settings/logo", { method: "POST", body: file, isForm: true });
        Branding.applyLogo(data.logo_url);
        refreshLogoPreview(data.logo_url);
        showAlert(alertBox, "Logo updated.", "success");
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    });
    document.getElementById("removeLogoBtn").addEventListener("click", async () => {
      if (!confirm("Remove the uploaded logo? Pages will fall back to the default emoji icon.")) return;
      const alertBox = document.getElementById("alertBox");
      try {
        await Api.request("admin", "/admin/settings/logo/remove", { method: "POST" });
        Branding.applyLogo(null);
        refreshLogoPreview(null);
        showAlert(alertBox, "Logo removed.", "success");
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    });

    document.getElementById("brandColor").addEventListener("input", (e) => {
      document.getElementById("brandColorHex").value = e.target.value;
    });
    document.getElementById("brandColorHex").addEventListener("input", (e) => {
      if (/^#[0-9a-fA-F]{6}$/.test(e.target.value)) document.getElementById("brandColor").value = e.target.value;
    });

    document.getElementById("saveGeneralBtn").addEventListener("click", async () => {
      const alertBox = document.getElementById("alertBox");
      const tuition_name = document.getElementById("tuitionName").value.trim();
      const brand_color = document.getElementById("brandColorHex").value.trim();
      if (!tuition_name) { showAlert(alertBox, "Tuition name can't be empty."); return; }
      if (!/^#[0-9a-fA-F]{6}$/.test(brand_color)) { showAlert(alertBox, "Brand color must be a hex color like #3654e0."); return; }
      try {
        await Api.request("admin", "/admin/settings/update", { method: "POST", body: { tuition_name, brand_color } });
        Branding.applyColor(brand_color);
        Branding.applyName(tuition_name);
        showAlert(alertBox, "Saved. Every portal will pick this up on next load.", "success");
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    });

    const input = document.getElementById("apiBaseUrl");
    input.value = localStorage.getItem("tms_api_base_url") || window.API_BASE_URL;

    document.getElementById("saveApiBtn").addEventListener("click", () => {
      localStorage.setItem("tms_api_base_url", input.value.trim());
      showAlert(document.getElementById("alertBox"), "Saved. Reload the page for it to take effect everywhere.", "success");
    });

    document.getElementById("logoutBtn2").addEventListener("click", () => {
      Api.clearToken("admin");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
