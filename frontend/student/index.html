<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Student Login · Tuition Management</title>
<link rel="stylesheet" href="../shared/css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card card">
      <div class="auth-logo"><span data-brand-icon>🎓</span><img data-brand-logo class="hidden" alt="Logo" style="height:26px; vertical-align:-6px; margin-right:4px;" /> <span data-brand-name="Student">Student Login</span></div>
      <div id="alertBox"></div>

      <form id="phoneForm">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" required placeholder="9876543210" autocomplete="username" />
        <button class="btn btn-block mt-16" type="submit" id="sendOtpBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Send OTP
        </button>
      </form>

      <form id="otpForm" class="hidden">
        <p class="text-muted" id="otpHint"></p>
        <label for="otp">Enter OTP</label>
        <input type="text" id="otp" required maxlength="6" inputmode="numeric" />
        <button class="btn btn-block mt-16" type="submit" id="verifyBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Verify &amp; Log In
        </button>
        <button type="button" class="btn btn-secondary btn-block mt-8" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Use a different number
        </button>
      </form>
    </div>
  </div>

  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/branding.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="../shared/js/fingerprint.js"></script>
  <script>
    const alertBox = document.getElementById("alertBox");
    let currentPhone = "";

    const returnTo = new URLSearchParams(location.search).get("return") || "dashboard.html";

    // Already logged in (e.g. tapped a QR deep link while still signed in) — skip straight through.
    if (Api.getToken("student")) {
      window.location.href = returnTo;
    }

    document.getElementById("phoneForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("sendOtpBtn");
      btn.disabled = true;
      alertBox.innerHTML = "";
      currentPhone = document.getElementById("phone").value.trim();
      try {
        const data = await Api.request(null, "/student/otp/request", { method: "POST", body: { phone: currentPhone } });
        document.getElementById("phoneForm").classList.add("hidden");
        document.getElementById("otpForm").classList.remove("hidden");
        document.getElementById("otpHint").textContent = data.mock_otp
          ? `Dev mode — your OTP is ${data.mock_otp}`
          : `OTP sent to ${currentPhone}`;
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      document.getElementById("otpForm").classList.add("hidden");
      document.getElementById("phoneForm").classList.remove("hidden");
      alertBox.innerHTML = "";
    });

    document.getElementById("otpForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("verifyBtn");
      btn.disabled = true;
      alertBox.innerHTML = "";
      try {
        const deviceFingerprint = await getDeviceFingerprint();
        const data = await Api.request(null, "/student/login", {
          method: "POST",
          body: { phone: currentPhone, otp: document.getElementById("otp").value.trim(), device_fingerprint: deviceFingerprint },
        });
        Api.setToken("student", data.token);
        window.location.href = returnTo;
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
