<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exam History · Student</title>
<link rel="stylesheet" href="../shared/css/styles.css" />
<style>
  .exam-tile-pending { border-color: var(--color-primary); border-left-width: 3px; background: color-mix(in srgb, var(--color-primary) 6%, white); }
  .exam-tile-medal-1 { border-color: #d4af37; border-left-width: 3px; background: color-mix(in srgb, #d4af37 8%, white); }
  .exam-tile-medal-2 { border-color: #9aa0a6; border-left-width: 3px; background: color-mix(in srgb, #9aa0a6 8%, white); }
  .exam-tile-medal-3 { border-color: #cd7f32; border-left-width: 3px; background: color-mix(in srgb, #cd7f32 8%, white); }
  .medal-icon { font-size: 22px; line-height: 1; }
  .rank-text { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/branding.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="../shared/js/icons.js"></script>
  <script src="js/common.js"></script>
  <script>
    requireStudentAuth();
    renderStudentShell("online-exams.html", `
      <h1>Exam History</h1>
      <div id="alertBox"></div>
      <div id="examsWrap"><p class="text-muted">Loading…</p></div>
    `);

    function isPending(r) {
      return r.exam_type === "online" && r.attempt_status !== "submitted" && (r.window_status === "upcoming" || r.window_status === "active");
    }

    function dateTimeText(r) {
      if (r.exam_type === "online") {
        return new Date(r.starts_at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
      }
      return new Date(`${r.exam_date}T00:00:00`).toLocaleDateString(undefined, { dateStyle: "medium" });
    }

    function typeBadge(r) {
      return r.exam_type === "online" ? `<span class="badge badge-success">Online</span>` : `<span class="badge badge-muted">Classroom</span>`;
    }

    function medalFor(rank) {
      if (rank === 1) return "🥇";
      if (rank === 2) return "🥈";
      if (rank === 3) return "🥉";
      return null;
    }

    function marksBlock(r) {
      if (isPending(r)) {
        if (r.window_status === "upcoming") return `<span class="badge badge-muted">Opens ${new Date(r.starts_at).toLocaleString()}</span>`;
        return r.attempt_status === "in_progress" ? `<span class="badge badge-warning">In progress</span>` : `<span class="badge badge-success">Open now</span>`;
      }
      if (r.marks_obtained != null) {
        const medal = medalFor(r.rank);
        return `
          <div class="value" style="font-size:20px;">${medal ? `<span class="medal-icon">${medal}</span> ` : ""}${r.marks_obtained}/${r.total_marks}</div>
          ${r.rank ? `<div class="rank-text">Rank #${r.rank}${r.total_participants ? ` of ${r.total_participants}` : ""}</div>` : ""}
        `;
      }
      return `<span class="text-muted">Pending</span>`;
    }

    function tileClass(r) {
      if (isPending(r)) return "exam-tile-pending";
      const medal = medalFor(r.rank);
      if (medal === "🥇") return "exam-tile-medal-1";
      if (medal === "🥈") return "exam-tile-medal-2";
      if (medal === "🥉") return "exam-tile-medal-3";
      return "";
    }

    function actionButton(r) {
      if (isPending(r) && r.window_status === "active") {
        return `<a class="btn btn-sm" href="take-exam.html?exam_id=${r.exam_id}">${iconSvg("play")} ${r.attempt_status === "in_progress" ? "Resume" : "Start"}</a>`;
      }
      if (r.exam_type === "online" && r.attempt_status === "submitted") {
        return `<a class="btn btn-secondary btn-sm" href="take-exam.html?exam_id=${r.exam_id}&attempt_id=${r.attempt_id}&review=1">${iconSvg("check-circle")} View Details</a>`;
      }
      return "";
    }

    (async () => {
      try {
        const exams = await Api.request("student", "/student/exams/history");
        const wrap = document.getElementById("examsWrap");
        if (exams.length === 0) {
          wrap.innerHTML = `<p class="text-muted">No exams yet.</p>`;
          return;
        }
        wrap.innerHTML = exams.map((r) => `
          <div class="card ${tileClass(r)}">
            <div class="flex-between" style="align-items:flex-start; flex-wrap:wrap; gap:12px;">
              <div>
                <h3 class="mb-0">${escapeHtml(r.exam_name)}</h3>
                <p class="text-muted mb-0" style="font-size:13px;">${dateTimeText(r)} · ${typeBadge(r)}</p>
                ${r.remarks ? `<p class="text-muted mb-0 mt-8" style="font-size:13px;"><strong>Remarks:</strong> ${escapeHtml(r.remarks)}</p>` : ""}
              </div>
              <div class="text-center" style="flex-shrink:0;">
                ${marksBlock(r)}
                <div class="mt-8">${actionButton(r)}</div>
              </div>
            </div>
          </div>
        `).join("");
      } catch (err) {
        showAlert(document.getElementById("alertBox"), err.message);
      }
    })();
  </script>
</body>
</html>
