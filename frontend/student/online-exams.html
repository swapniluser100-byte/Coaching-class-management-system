<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exam History · Student</title>
<link rel="stylesheet" href="../shared/css/styles.css" />
<style>
  .exam-row-pending td { background: color-mix(in srgb, var(--color-primary) 7%, white); }
  .exam-row-pending td:first-child { border-left: 3px solid var(--color-primary); }
</style>
</head>
<body>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/branding.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="../shared/js/icons.js"></script>
  <script src="js/common.js"></script>
  <script>
    requireStudentAuth();
    renderStudentShell("online-exams.html", `
      <h1>Exam History</h1>
      <div id="alertBox"></div>
      <div id="examsWrap"><p class="text-muted">Loading…</p></div>
    `);

    function isPending(r) {
      return r.exam_type === "online" && r.attempt_status !== "submitted" && (r.window_status === "upcoming" || r.window_status === "active");
    }

    function dateTimeCell(r) {
      if (r.exam_type === "online") {
        return new Date(r.starts_at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
      }
      return new Date(`${r.exam_date}T00:00:00`).toLocaleDateString(undefined, { dateStyle: "medium" });
    }

    function typeBadge(r) {
      return r.exam_type === "online" ? `<span class="badge badge-success">Online</span>` : `<span class="badge badge-muted">Classroom</span>`;
    }

    function marksCell(r) {
      if (isPending(r)) {
        if (r.window_status === "upcoming") return `<span class="badge badge-muted">Opens ${new Date(r.starts_at).toLocaleString()}</span>`;
        return r.attempt_status === "in_progress" ? `<span class="badge badge-warning">In progress</span>` : `<span class="badge badge-success">Open now</span>`;
      }
      if (r.marks_obtained != null) return `<strong>${r.marks_obtained}/${r.total_marks}</strong>`;
      return `<span class="text-muted">Pending</span>`;
    }

    function actionCell(r) {
      if (isPending(r) && r.window_status === "active") {
        return `<a class="btn btn-sm" href="take-exam.html?exam_id=${r.exam_id}">${iconSvg("play")} ${r.attempt_status === "in_progress" ? "Resume" : "Start"}</a>`;
      }
      if (r.exam_type === "online" && r.attempt_status === "submitted") {
        return `<a class="btn btn-secondary btn-sm" href="take-exam.html?exam_id=${r.exam_id}&attempt_id=${r.attempt_id}&review=1">${iconSvg("check-circle")} View Details</a>`;
      }
      return `<span class="text-muted">—</span>`;
    }

    (async () => {
      try {
        const exams = await Api.request("student", "/student/exams/history");
        const wrap = document.getElementById("examsWrap");
        if (exams.length === 0) {
          wrap.innerHTML = `<p class="text-muted">No exams yet.</p>`;
          return;
        }
        wrap.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Exam Name</th><th>Date / Time</th><th>Type</th><th>Marks</th><th>Remarks</th><th></th></tr></thead>
              <tbody>
                ${exams.map((r) => `
                  <tr class="${isPending(r) ? "exam-row-pending" : ""}">
                    <td>${escapeHtml(r.exam_name)}</td>
                    <td>${dateTimeCell(r)}</td>
                    <td>${typeBadge(r)}</td>
                    <td>${marksCell(r)}</td>
                    <td>${r.remarks ? escapeHtml(r.remarks) : `<span class="text-muted">—</span>`}</td>
                    <td>${actionCell(r)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        showAlert(document.getElementById("alertBox"), err.message);
      }
    })();
  </script>
</body>
</html>
