<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exam Marks · Student</title>
<link rel="stylesheet" href="../shared/css/styles.css" />
<style>
  .medal-hero { font-size: 56px; line-height: 1; margin-bottom: 2px; }
  .medal-hero img { height: 1.2em; width: auto; }
  .medal-hero.celebrate { animation: medal-pop 0.6s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes medal-pop {
    0% { transform: scale(0) rotate(-25deg); opacity: 0; }
    60% { transform: scale(1.25) rotate(10deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); }
  }
  .medal-message { font-weight: 700; font-size: 16px; margin: 2px 0 0; }
  .medal-message.gold { color: #b8860b; }
  .medal-message.silver { color: #6b7280; }
  .medal-message.bronze { color: #a0522d; }
  .result-card-medal-1 { border-color: #d4af37; background: color-mix(in srgb, #d4af37 6%, white); }
  .result-card-medal-2 { border-color: #9aa0a6; background: color-mix(in srgb, #9aa0a6 6%, white); }
  .result-card-medal-3 { border-color: #cd7f32; background: color-mix(in srgb, #cd7f32 6%, white); }

  .lookup-head { text-align: center; margin-bottom: 16px; }
  .lookup-head h1 { margin-bottom: 6px; }
  .lookup-head p { margin: 0; color: var(--color-text-muted); }
  .lookup-form { display: flex; gap: 10px; margin-bottom: 16px; }
  .lookup-form input { flex: 1; min-width: 0; text-transform: uppercase; margin: 0; }
  .lookup-form .btn { flex-shrink: 0; }

  .exam-head { display: flex; align-items: center; gap: 12px; }
  .exam-head-icon { color: var(--color-primary); flex-shrink: 0; display: flex; }
  .exam-head h2 { margin: 0; font-size: 17px; }
  .exam-head p { margin: 2px 0 0; font-size: 13px; color: var(--color-text-muted); }
  .stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 14px; padding: 12px 0; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 10px; }
  .stat-cell { text-align: center; padding: 0 6px; border-left: 1px solid var(--color-border); }
  .stat-cell:first-child { border-left: none; }
  .stat-cell .stat-value { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 22px; font-weight: 700; color: var(--color-text); }
  .stat-cell .stat-value svg { color: var(--color-text-muted); }
  .stat-cell .stat-label { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }

  .top-card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .top-row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid var(--color-border); }
  .top-row-rank { width: 32px; height: 32px; border: 1.5px solid var(--color-text-muted); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; overflow: hidden; }
  .top-row-rank.has-image { border: none; border-radius: 0; width: 36px; height: 36px; }
  .top-row-rank img { width: 100%; height: 100%; object-fit: contain; }
  .top-row-name { flex: 1; font-weight: 500; }
  .top-row-marks { font-weight: 600; flex-shrink: 0; padding-right: 8px; }
  @media (max-width: 480px) {
    .stat-cell .stat-value { font-size: 18px; flex-direction: column; gap: 2px; }
  }
</style>
</head>
<body>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/branding.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="../shared/js/icons.js"></script>
  <script src="js/common.js"></script>
  <script>
    requireStudentAuth();
    renderStudentShell("exam.html", `
      <div class="lookup-head">
        <h1>View Exam Marks</h1>
        <p>Enter your exam code to view detailed results.</p>
      </div>
      <div id="alertBox"></div>
      <form id="examForm" class="lookup-form">
        <input id="examCode" placeholder="e.g. K7M2QWXT9" required />
        <button class="btn" type="submit">View Results</button>
      </form>
      <div class="card hidden" id="resultCard"></div>
      <div class="card top-card hidden" id="topCard">
        <h3>Top 3 Performers</h3>
        <div id="topList"></div>
      </div>
    `);

    function medalFor(rank) {
      if (rank === 1) return { icon: Branding.rankIcon(1), label: "1st", cls: "gold", tile: "result-card-medal-1" };
      if (rank === 2) return { icon: Branding.rankIcon(2), label: "2nd", cls: "silver", tile: "result-card-medal-2" };
      if (rank === 3) return { icon: Branding.rankIcon(3), label: "3rd", cls: "bronze", tile: "result-card-medal-3" };
      return null;
    }

    function renderTopStudents(topStudents) {
      const topCard = document.getElementById("topCard");
      if (!topStudents || topStudents.length === 0) {
        topCard.classList.add("hidden");
        return;
      }
      topCard.classList.remove("hidden");
      document.getElementById("topList").innerHTML = topStudents.map((s) => {
        const image = s.rank <= 3 && Branding.hasRankImage(s.rank);
        return `
          <div class="top-row">
            <span class="top-row-rank ${image ? "has-image" : ""}">${image ? Branding.rankIcon(s.rank, { fill: true }) : s.rank}</span>
            <span class="top-row-name">${escapeHtml(s.name)}</span>
            <span class="top-row-marks">${s.marks_obtained}</span>
          </div>
        `;
      }).join("");
    }

    document.getElementById("examForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById("alertBox");
      const resultCard = document.getElementById("resultCard");
      alertBox.innerHTML = "";
      resultCard.classList.add("hidden");
      document.getElementById("topCard").classList.add("hidden");
      try {
        await Branding.load();
        const data = await Api.request("student", "/student/exam/view", {
          method: "POST",
          body: { exam_code: document.getElementById("examCode").value.trim() },
        });
        const medal = medalFor(data.rank);
        resultCard.classList.remove("hidden");
        resultCard.className = `card ${medal ? medal.tile : ""}`;
        const examDate = new Date(`${data.exam.exam_date}T00:00:00`).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
        const stat = (icon, value, label) => `
          <div class="stat-cell">
            <div class="stat-value">${iconSvg(icon, 20)}<span>${value}</span></div>
            <div class="stat-label">${label}</div>
          </div>`;
        resultCard.innerHTML = `
          ${medal ? `
            <div class="text-center mb-16">
              <div class="medal-hero celebrate">${medal.icon}</div>
              <p class="medal-message ${medal.cls}">🎉 You ranked ${medal.label} in this exam!</p>
            </div>
          ` : ""}
          <div class="exam-head">
            <span class="exam-head-icon">${iconSvg("graduation-cap", 32)}</span>
            <div>
              <h2>${escapeHtml(data.exam.exam_name)}</h2>
              <p>${examDate} · Total Marks: ${data.exam.total_marks}</p>
            </div>
          </div>
          <div class="stat-strip">
            ${stat("graduation-cap", data.marks_obtained ?? "—", "Your Marks")}
            ${stat("award", data.rank ?? "—", `Rank${data.total_students ? ` (of ${data.total_students})` : ""}`)}
            ${stat("bar-chart", data.batch_average ?? "—", "Batch Avg")}
            ${stat("star", data.topper_marks ?? "—", "Topper's Marks")}
          </div>
          ${data.remarks ? `<p class="mt-16 mb-0"><strong>Remarks:</strong> ${escapeHtml(data.remarks)}</p>` : ""}
          ${data.marks_obtained == null ? `<div class="alert alert-info mt-16">Marks for this exam haven't been uploaded yet.</div>` : ""}
        `;
        renderTopStudents(data.top_students);
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    });
  </script>
</body>
</html>
