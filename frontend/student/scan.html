<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scan QR · Student</title>
<link rel="stylesheet" href="../shared/css/styles.css" />
<style>
  #videoWrap { position: relative; width: 100%; max-width: 360px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #000; }
  #video { width: 100%; display: block; }
  #scanBox {
    position: absolute; inset: 15%; border: 3px solid #fff; border-radius: 12px;
    box-shadow: 0 0 0 999px rgba(0,0,0,0.35);
  }
</style>
</head>
<body>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="../shared/js/fingerprint.js"></script>
  <script src="../shared/js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    // This page works two ways:
    //  - Logged in (has a student JWT): identity is already known, so it
    //    marks attendance the same way it always has (POST /attendance/mark).
    //  - Not logged in: no OTP/login required at all. After the QR is
    //    scanned/opened, the student enters their phone number + a 4-digit
    //    PIN (set once by admin) and that's used to identify them instead
    //    (POST /attendance/mark-pin). Device-fingerprint binding, geo-fence
    //    and one-mark-per-day still apply exactly as before either way.
    const isLoggedIn = !!Api.getToken("student");

    const pageInnerHtml = `
      <h1>Mark Attendance</h1>
      <div id="alertBox"></div>
      <div id="scannerCard" class="card">
        <div id="videoWrap">
          <video id="video" playsinline muted></video>
          <div id="scanBox"></div>
        </div>
        <canvas id="canvas" class="hidden"></canvas>
        <p class="text-center text-muted mt-16" id="statusText">Point your camera at the QR code shown by your tutor.</p>
      </div>
      <div id="pinFormCard" class="card hidden">
        <h2>Who's marking attendance?</h2>
        <label for="phoneInput">Phone Number</label>
        <input type="tel" id="phoneInput" placeholder="9876543210" />
        <label for="pinInput">4-digit PIN</label>
        <input type="text" id="pinInput" inputmode="numeric" maxlength="4" placeholder="••••" />
        <button class="btn btn-block mt-16" id="submitPinBtn">${iconSvg("check-circle")} Mark Attendance</button>
      </div>
      <div id="resultCard" class="card hidden text-center">
        <div id="resultIcon" style="font-size:42px;"></div>
        <h2 id="resultTitle"></h2>
        <p id="resultMessage" class="text-muted"></p>
        <button class="btn btn-secondary mt-16" id="scanAgainBtn">${iconSvg("refresh-cw")} Scan Again</button>
      </div>
    `;

    if (isLoggedIn) {
      renderStudentShell("scan.html", pageInnerHtml);
    } else {
      document.body.innerHTML = `
        <div class="container-narrow">
          ${pageInnerHtml}
          <p class="text-center text-muted mt-16" style="font-size:13px;">
            <a href="index.html">Log in</a> to view attendance history and exam marks.
          </p>
        </div>
      `;
    }

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const statusText = document.getElementById("statusText");

    let stream = null;
    let scanning = false;
    let rafId = null;
    let currentPayload = null;

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        await video.play();
        scanning = true;
        rafId = requestAnimationFrame(tick);
      } catch (err) {
        showAlert(document.getElementById("alertBox"), "Camera access is required to scan: " + err.message);
      }
    }

    function stopCamera() {
      scanning = false;
      if (rafId) cancelAnimationFrame(rafId);
      if (stream) stream.getTracks().forEach((t) => t.stop());
    }

    function tick() {
      if (!scanning) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
        if (code && code.data) {
          onQrDecoded(code.data);
          return;
        }
      }
      rafId = requestAnimationFrame(tick);
    }

    function extractPayload(raw) {
      // The QR encodes a URL (student/scan.html?session_id=...&batch_id=...&token=...)
      // so a phone's native camera app can open it directly. Support plain
      // JSON too, in case an older QR is still on screen somewhere.
      try {
        const url = new URL(raw);
        const p = {
          session_id: url.searchParams.get("session_id"),
          batch_id: url.searchParams.get("batch_id"),
          token: url.searchParams.get("token"),
        };
        if (p.session_id && p.batch_id && p.token) return p;
      } catch {}
      try {
        const p = JSON.parse(raw);
        if (p.session_id && p.batch_id && p.token) return p;
      } catch {}
      return null;
    }

    function showPinForm() {
      document.getElementById("scannerCard").classList.add("hidden");
      document.getElementById("pinFormCard").classList.remove("hidden");
    }

    async function onQrDecoded(raw) {
      scanning = false;
      const payload = extractPayload(raw);
      if (!payload) {
        statusText.textContent = "That QR code isn't recognized. Point at the attendance QR.";
        scanning = true;
        rafId = requestAnimationFrame(tick);
        return;
      }
      stopCamera();
      currentPayload = payload;
      if (isLoggedIn) {
        statusText.textContent = "Getting your location…";
        await markAttendanceLoggedIn(payload);
      } else {
        showPinForm();
      }
    }

    function getLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error("Geolocation is not supported on this device"));
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve(pos.coords),
          (err) => reject(new Error("Location permission is required to mark attendance: " + err.message)),
          { enableHighAccuracy: true, timeout: 10000 }
        );
      });
    }

    async function markAttendanceLoggedIn(payload) {
      try {
        const coords = await getLocation();
        const deviceFingerprint = await getDeviceFingerprint();
        const data = await Api.request("student", "/attendance/mark", {
          method: "POST",
          body: {
            session_id: payload.session_id,
            batch_id: payload.batch_id,
            token: payload.token,
            geo_lat: coords.latitude,
            geo_long: coords.longitude,
            device_fingerprint: deviceFingerprint,
          },
        });
        showResult(true, "Attendance Marked!", `Marked present for ${data.date}.`);
      } catch (err) {
        showResult(false, "Could Not Mark Attendance", err.message);
      }
    }

    async function markAttendanceWithPin(payload, phone, pin) {
      try {
        const coords = await getLocation();
        const deviceFingerprint = await getDeviceFingerprint();
        const data = await Api.request(null, "/attendance/mark-pin", {
          method: "POST",
          body: {
            session_id: payload.session_id,
            batch_id: payload.batch_id,
            token: payload.token,
            phone,
            pin,
            geo_lat: coords.latitude,
            geo_long: coords.longitude,
            device_fingerprint: deviceFingerprint,
          },
        });
        showResult(true, "Attendance Marked!", `Marked present for ${data.date}.`);
      } catch (err) {
        showResult(false, "Could Not Mark Attendance", err.message);
      }
    }

    function showResult(success, title, message, icon) {
      document.getElementById("scannerCard").classList.add("hidden");
      document.getElementById("pinFormCard").classList.add("hidden");
      document.getElementById("resultCard").classList.remove("hidden");
      document.getElementById("resultIcon").textContent = icon || (success ? "✅" : "⚠️");
      document.getElementById("resultTitle").textContent = title;
      document.getElementById("resultMessage").textContent = message;
    }

    document.getElementById("submitPinBtn").addEventListener("click", async () => {
      const phone = document.getElementById("phoneInput").value.trim();
      const pin = document.getElementById("pinInput").value.trim();
      const alertBox = document.getElementById("alertBox");
      alertBox.innerHTML = "";
      if (!phone) { showAlert(alertBox, "Enter your phone number."); return; }
      if (!/^\d{4}$/.test(pin)) { showAlert(alertBox, "PIN must be exactly 4 digits."); return; }

      showResult(true, "Marking Attendance…", "Please wait while we verify your location.", "⏳");
      await markAttendanceWithPin(currentPayload, phone, pin);
    });

    document.getElementById("scanAgainBtn").addEventListener("click", () => {
      document.getElementById("resultCard").classList.add("hidden");
      document.getElementById("pinFormCard").classList.add("hidden");
      document.getElementById("scannerCard").classList.remove("hidden");
      statusText.textContent = "Point your camera at the QR code shown by your tutor.";
      startCamera();
    });

    // The QR also encodes a plain URL (this page + session_id/batch_id/token
    // as query params) so a phone's native camera app can open it directly —
    // scanning with the native camera otherwise just shows raw JSON text with
    // nothing to "open". If those params are present, skip the in-page camera
    // scanner entirely.
    const deepLinkParams = new URLSearchParams(location.search);
    const deepLinkPayload = ["session_id", "batch_id", "token"].every((k) => deepLinkParams.get(k))
      ? {
          session_id: deepLinkParams.get("session_id"),
          batch_id: deepLinkParams.get("batch_id"),
          token: deepLinkParams.get("token"),
        }
      : null;

    if (deepLinkPayload) {
      currentPayload = deepLinkPayload;
      if (isLoggedIn) {
        showResult(true, "Marking Attendance…", "Please wait while we verify your location.", "⏳");
        markAttendanceLoggedIn(deepLinkPayload);
      } else {
        showPinForm();
      }
    } else {
      startCamera();
    }
    window.addEventListener("beforeunload", stopCamera);
  </script>
</body>
</html>
