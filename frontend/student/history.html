<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>History · Student</title>
<link rel="stylesheet" href="../shared/css/styles.css" />
</head>
<body>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    requireStudentAuth();
    renderStudentShell("history.html", `
      <h1>Attendance History</h1>
      <div id="alertBox"></div>
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Batch</th><th>Status</th></tr></thead>
            <tbody id="historyBody"><tr><td colspan="3" class="text-muted">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    `);

    (async () => {
      try {
        const rows = await Api.request("student", "/student/history");
        const tbody = document.getElementById("historyBody");
        if (rows.length === 0) {
          tbody.innerHTML = `<tr><td colspan="3" class="text-muted">No attendance records yet.</td></tr>`;
          return;
        }
        tbody.innerHTML = rows.map((r) => `
          <tr>
            <td>${r.date}</td>
            <td>${escapeHtml(r.batch_name)}</td>
            <td>${r.status === "present" ? `<span class="badge badge-success">Present</span>` : `<span class="badge badge-danger">Absent</span>`}</td>
          </tr>
        `).join("");
      } catch (err) {
        showAlert(document.getElementById("alertBox"), err.message);
      }
    })();
  </script>
</body>
</html>
