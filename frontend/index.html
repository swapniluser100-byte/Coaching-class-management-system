<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tuition Management System</title>
<link rel="stylesheet" href="shared/css/styles.css" />
<style>
  .brand-hero { text-align: center; margin-bottom: 8px; }
  .brand-hero-icon { font-size: 44px; line-height: 1; margin-bottom: 6px; }
  .brand-hero-logo { max-height: 72px; max-width: 240px; margin-bottom: 6px; }
  .brand-hero-name { font-size: 40px; font-weight: 800; color: var(--color-primary); letter-spacing: -0.02em; margin: 0 0 4px; }
</style>
</head>
<body>
  <div class="auth-wrap">
    <div style="width:100%; max-width:520px;">
      <div class="brand-hero">
        <div class="brand-hero-icon" data-brand-icon>📚</div>
        <img data-brand-logo class="brand-hero-logo hidden" alt="Logo" />
        <h1 class="brand-hero-name" data-brand-name>Tuition Management System</h1>
      </div>
      <p class="text-center text-muted mb-0">Pune · 11th / 12th / CET Batches</p>
      <div class="grid grid-3 mt-16">
        <a class="card text-center" href="admin/index.html" style="text-decoration:none;">
          <div style="font-size:32px;">🛠️</div>
          <h3>Admin</h3>
          <p class="text-muted" style="font-size:13px;">Console</p>
        </a>
        <a class="card text-center" href="teacher/index.html" style="text-decoration:none;">
          <div style="font-size:32px;">🧑‍🏫</div>
          <h3>Teacher</h3>
          <p class="text-muted" style="font-size:13px;">Dashboard</p>
        </a>
        <a class="card text-center" href="student/index.html" style="text-decoration:none;">
          <div style="font-size:32px;">🎓</div>
          <h3>Student</h3>
          <p class="text-muted" style="font-size:13px;">Portal</p>
        </a>
      </div>
    </div>
  </div>

  <script src="shared/js/config.js"></script>
  <script src="shared/js/branding.js"></script>
</body>
</html>
