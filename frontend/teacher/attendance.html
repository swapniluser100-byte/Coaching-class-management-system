<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Attendance / QR · Teacher</title>
<link rel="stylesheet" href="../shared/css/styles.css" />
</head>
<body>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/branding.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="../shared/js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    requireTeacherAuth();
    renderTeacherShell("attendance.html", `
      <h1>Attendance</h1>
      <div id="alertBox"></div>

      <div class="card">
        <label>Batch</label>
        <select id="batchSelect"></select>
        <div id="sessionControls" class="mt-16">
          <button class="btn" id="startBtn">${iconSvg("play")} Start Attendance Session</button>
        </div>
      </div>

      <div class="card hidden" id="qrCard">
        <div class="qr-frame">
          <div id="qrCanvas"></div>
          <div class="qr-timer" id="qrTimer">rotates in 10s</div>
          <p class="text-muted" style="font-size:13px;">Students scan this from the student portal's "Scan QR" page. Ends automatically at <strong id="sessionEndsAt"></strong>.</p>
          <button class="btn btn-danger" id="stopBtn">${iconSvg("stop")} End Session</button>
        </div>
      </div>

      <div class="card hidden" id="liveCard">
        <h2>Live Attendance</h2>
        <div class="summary-tiles">
          <div class="card stat-tile stat-tile-present" style="margin-bottom:0;">
            <div class="value" id="presentCount">0</div>
            <div class="label">Present</div>
          </div>
          <div class="card stat-tile stat-tile-absent" style="margin-bottom:0;">
            <div class="value" id="absentCount">0</div>
            <div class="label">Absent</div>
          </div>
        </div>
        <div class="flex gap-8 mt-16" style="flex-wrap:wrap;">
          <input id="studentSearch" placeholder="Search student by name or phone…" style="flex:1; min-width:200px;" />
          <select id="statusFilter" style="max-width:160px;">
            <option value="all">All statuses</option>
            <option value="present">Present only</option>
            <option value="absent">Absent only</option>
          </select>
        </div>
        <p class="text-muted mt-8" style="font-size:12px;">No good phone to scan? Use "Mark Present" to mark them manually — it's flagged as a manual entry everywhere attendance is shown.</p>
        <div class="table-wrap mt-16">
          <table>
            <thead><tr><th>Student</th><th>Status</th><th>Marked At</th><th></th></tr></thead>
            <tbody id="liveBody"></tbody>
          </table>
        </div>
      </div>
    `);

    const params = new URLSearchParams(location.search);
    const preselectBatchId = params.get("batch_id");

    let currentSession = null; // { session_id, batch_id, ends_at }
    let qrRotateTimeout = null;
    let liveInterval = null;
    let countdownInterval = null;
    let qrInstance = null;
    let liveStudents = [];

    async function loadBatches() {
      const batches = await Api.request("tutor", "/tutor/batches");
      document.getElementById("batchSelect").innerHTML = batches
        .map((b) => `<option value="${b.id}" ${b.id === preselectBatchId ? "selected" : ""}>${escapeHtml(b.name)}</option>`)
        .join("");
    }

    async function drawQr() {
      if (!currentSession) return;
      try {
        const data = await Api.request("tutor", `/qr/current?session_id=${currentSession.session_id}`);
        // Encode a real URL (not just JSON) so a phone's native camera app
        // can open it directly and land on the student scan page with the
        // token pre-filled — scanning raw JSON with a generic camera app
        // has nothing to "open" and just shows the text.
        const params = new URLSearchParams({
          session_id: data.session_id,
          batch_id: data.batch_id,
          token: data.token,
        });
        const payload = `${location.origin}/student/scan.html?${params.toString()}`;
        if (!qrInstance) {
          document.getElementById("qrCanvas").innerHTML = "";
          qrInstance = new QRCode(document.getElementById("qrCanvas"), {
            width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M,
          });
        }
        qrInstance.makeCode(payload);

        const msLeft = data.expires_at - Date.now();
        scheduleRotation(Math.max(msLeft, 500));
        startCountdown(data.expires_at);
      } catch (err) {
        if (err.message.includes("closed")) {
          endSessionUi();
          showAlert(document.getElementById("alertBox"), "Attendance session has closed.", "info");
        } else {
          showAlert(document.getElementById("alertBox"), err.message);
        }
      }
    }

    function scheduleRotation(delayMs) {
      clearTimeout(qrRotateTimeout);
      qrRotateTimeout = setTimeout(drawQr, delayMs + 150);
    }

    function startCountdown(expiresAt) {
      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        const secs = Math.max(0, Math.ceil((expiresAt - Date.now()) / 1000));
        document.getElementById("qrTimer").textContent = `rotates in ${secs}s`;
      }, 250);
    }

    async function refreshLive() {
      if (!currentSession) return;
      try {
        const data = await Api.request("tutor", `/attendance/batch/${currentSession.batch_id}`);
        liveStudents = data.students;
        const present = data.students.filter((s) => s.status === "present");
        document.getElementById("presentCount").textContent = present.length;
        document.getElementById("absentCount").textContent = data.students.length - present.length;
        renderLiveTable();
      } catch (err) {
        // non-fatal; keep polling
      }
    }

    function renderLiveTable() {
      const query = document.getElementById("studentSearch").value.trim().toLowerCase();
      const statusFilter = document.getElementById("statusFilter").value;

      let filtered = query
        ? liveStudents.filter((s) => s.name.toLowerCase().includes(query) || (s.phone || "").includes(query))
        : liveStudents;
      if (statusFilter === "present") filtered = filtered.filter((s) => s.status === "present");
      else if (statusFilter === "absent") filtered = filtered.filter((s) => s.status !== "present");

      if (filtered.length === 0) {
        document.getElementById("liveBody").innerHTML = `<tr><td colspan="4" class="text-muted">No students match the current search / filter.</td></tr>`;
        return;
      }

      document.getElementById("liveBody").innerHTML = filtered.map((s) => `
        <tr>
          <td>${escapeHtml(s.name)}</td>
          <td>
            ${s.status === "present" ? `<span class="badge badge-success">Present</span>`
              : s.status === "absent" ? `<span class="badge badge-danger">Absent</span>`
              : `<span class="badge badge-muted">Not yet</span>`}
            ${s.source === "manual" ? `<span class="badge badge-warning">Manual</span>` : ""}
          </td>
          <td>${s.timestamp || "-"}</td>
          <td>${s.status === "present"
            ? `<button class="btn btn-danger btn-sm" onclick="markAbsent('${s.student_id}')">${iconSvg("stop")} Mark Absent</button>`
            : `<button class="btn btn-secondary btn-sm" onclick="markManual('${s.student_id}')">${iconSvg("check-circle")} Mark Present</button>`}</td>
        </tr>
      `).join("");
    }

    document.getElementById("studentSearch").addEventListener("input", renderLiveTable);
    document.getElementById("statusFilter").addEventListener("change", renderLiveTable);

    window.markManual = async (studentId) => {
      if (!currentSession) return;
      try {
        await Api.request("tutor", "/attendance/mark-manual", {
          method: "POST",
          body: { batch_id: currentSession.batch_id, student_id: studentId },
        });
        await refreshLive();
      } catch (err) {
        showAlert(document.getElementById("alertBox"), err.message);
      }
    };

    window.markAbsent = async (studentId) => {
      if (!currentSession) return;
      if (!confirm("Mark this student absent? This overrides their current present mark.")) return;
      try {
        await Api.request("tutor", "/attendance/mark-absent", {
          method: "POST",
          body: { batch_id: currentSession.batch_id, student_id: studentId },
        });
        await refreshLive();
      } catch (err) {
        showAlert(document.getElementById("alertBox"), err.message);
      }
    };

    function endSessionUi() {
      clearTimeout(qrRotateTimeout);
      clearInterval(countdownInterval);
      clearInterval(liveInterval);
      currentSession = null;
      document.getElementById("qrCard").classList.add("hidden");
      document.getElementById("sessionControls").innerHTML = `<button class="btn" id="startBtn">${iconSvg("play")} Start Attendance Session</button>`;
      document.getElementById("startBtn").addEventListener("click", startSession);
    }

    async function startSession() {
      const batchId = document.getElementById("batchSelect").value;
      if (!batchId) return;
      try {
        const data = await Api.request("tutor", "/qr/start", { method: "POST", body: { batch_id: batchId } });
        currentSession = { session_id: data.session_id, batch_id: data.batch_id, ends_at: data.ends_at };
        document.getElementById("sessionEndsAt").textContent = new Date(data.ends_at).toLocaleTimeString();
        document.getElementById("qrCard").classList.remove("hidden");
        document.getElementById("liveCard").classList.remove("hidden");
        document.getElementById("sessionControls").innerHTML = `<span class="badge badge-success">Session active</span>`;
        await drawQr();
        await refreshLive();
        liveInterval = setInterval(refreshLive, 4000);
      } catch (err) {
        showAlert(document.getElementById("alertBox"), err.message);
      }
    }

    document.getElementById("startBtn").addEventListener("click", startSession);

    document.getElementById("stopBtn").addEventListener("click", async () => {
      if (!currentSession) return;
      try {
        await Api.request("tutor", "/qr/stop", { method: "POST", body: { session_id: currentSession.session_id } });
        await refreshLive();
      } catch (err) {
        showAlert(document.getElementById("alertBox"), err.message);
      } finally {
        endSessionUi();
      }
    });

    loadBatches().catch((err) => showAlert(document.getElementById("alertBox"), err.message));
  </script>
</body>
</html>
